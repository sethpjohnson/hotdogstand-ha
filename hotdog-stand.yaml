# =============================================================================
#  HOT DOG STAND  —  Home Assistant theme (target: HA 2026.7.2)
# =============================================================================
#  A faithful, garish re-creation of the Windows 3.1 "Hot Dog Stand" scheme.
#  Loud red / yellow / black. Single flat theme (no light/dark modes) so it
#  looks identically garish regardless of the viewer's system setting.
#
#  Layout (yellow desktop, white windows, red chrome — the classic Win 3.1 look):
#    * PAGE / DESKTOP      -> yellow   (behind the cards)
#    * CARD / WINDOW BODIES -> white   (text/icons -> BLACK)
#    * CHROME: app header, sidebar, card TITLE BARS -> red (text -> WHITE;
#      yellow for the active tab/selection accent). Sidebar + header are framed
#      off the desktop with a thick 5px black edge (see card-mod-root/-sidebar).
#    * INVERSE: toasts / tooltips / chips / badges -> black (text -> YELLOW)
#    * DROPDOWN MENUS -> white (text -> BLACK; selected row = red bar, white)
#    * INPUTS -> transparent on the white body, BLACK ink, hard BLACK border
#
#  THE CONTRAST RULE (enforced on every foreground/background pairing):
#    Allowed ONLY:  black-on-yellow · white-on-red · yellow-on-black ·
#                   black-on-white (menus / inputs / code editor).
#    Forbidden:     white-on-yellow · yellow-on-red* · black-on-red · red-on-red.
#    (*yellow-on-red is used ONLY as deliberate active/accent emphasis on the
#     red chrome — never for body text.)
#
#  Rule of thumb: any text/icon on a YELLOW surface -> black;
#                 any text/icon on a RED surface   -> white (yellow if active);
#                 any text/icon on a BLACK surface  -> yellow.
#
#  Windows 3.1 had no drop shadows -> cards are FLAT (no box-shadow), framed by a
#  thick 5px black border (the "active window" look) with a red title bar.
# =============================================================================

hotdog-stand-theme:

  # ---------------------------------------------------------------------------
  # 0. BASE PALETTE TOKENS  (define once, reference via var(--hd-*) everywhere)
  # ---------------------------------------------------------------------------
  # Colors sampled from the real Windows 3.1 "Hot Dog Stand" scheme: the window
  # body/desktop is PURE yellow (#FFFF00, not gold) and the chrome is pure red.
  hd-red: "#FF0000"      # chrome / accent / active-window title bars
  hd-yellow: "#FFFF00"   # primary surface / background / body (pure, not gold)
  hd-black: "#000000"    # borders; text on yellow; inverse surface
  hd-white: "#FFFFFF"    # text on red; menu/input surface
  hd-red-dk: "#B00000"   # hover / pressed on red chrome
  # Yellow surfaces do NOT darken on hover/pressed — a hover tint is a modern
  # convention, not part of the original scheme. This equals the base yellow so
  # every "hover/pressed/dim" yellow reference stays flat #FFFF00.
  hd-yellow-dk: "#FFFF00"
  hd-grey: "#808080"     # disabled text / lines only

  # Windows 3.1 "MS Sans Serif" look via the pixelated webfont (loaded document-
  # wide by /local/hotdog-font.js — see frontend.extra_module_url). Falls back to
  # real MS Sans Serif on Windows, then Tahoma/Geneva. Code stays monospace.
  hd-font: "'Pixelated MS Sans Serif', 'MS Sans Serif', Tahoma, Geneva, sans-serif"
  ha-font-family-body: var(--hd-font)
  ha-font-family-heading: var(--hd-font)
  ha-font-family-longform: var(--hd-font)
  primary-font-family: var(--hd-font)
  paper-font-common-base_-_font-family: var(--hd-font)
  mdc-typography-font-family: var(--hd-font)

  # ---------------------------------------------------------------------------
  # 1. CORE INTERFACE COLORS
  # ---------------------------------------------------------------------------
  # primary-color must be RED, not yellow: ha-tab, text links, and spinners draw
  # themselves in --primary-color directly, and on the now-YELLOW body a
  # yellow-on-yellow accent is invisible. Red reads on yellow. On the red chrome
  # (header toolbar) the tab accents are handled by the yellow ha-tab-active /
  # app-header-selection tokens instead, so red primary-color never lands
  # red-on-red there.
  primary-color: var(--hd-red)
  dark-primary-color: var(--hd-red-dk)
  light-primary-color: var(--hd-red)
  accent-color: var(--hd-yellow)
  divider-color: var(--hd-black)
  disabled-color: var(--hd-grey)
  disabled-text-color: var(--hd-grey)
  scrollbar-thumb-color: var(--hd-black)
  # No hover/press ripple tint anywhere — clickable cards/tiles washed slightly
  # grey on hover (a modern state layer). Win 3.1 had no such effect. Tiles
  # override the ripple COLOR but not its OPACITY, so forcing every ripple
  # hover/pressed opacity to 0 (these inherit through shadow DOM) kills the wash
  # regardless of the local color.
  ha-ripple-color: transparent
  ha-ripple-hover-opacity: "0"
  ha-ripple-pressed-opacity: "0"
  md-ripple-hover-opacity: "0"
  md-ripple-pressed-opacity: "0"

  # ---------------------------------------------------------------------------
  # 2. TEXT COLORS  (default surface is now yellow -> black text)
  # ---------------------------------------------------------------------------
  primary-text-color: var(--hd-black)
  secondary-text-color: var(--hd-black)
  text-primary-color: var(--hd-white)         # text drawn ON the primary (red)
  text-light-primary-color: var(--hd-black)   # dark text variant (on light bg)
  text-medium-emphasis-color: var(--hd-black)

  # ---------------------------------------------------------------------------
  # 3. BACKGROUNDS  (yellow desktop behind the cards; card bodies are white)
  # ---------------------------------------------------------------------------
  primary-background-color: var(--hd-yellow)
  secondary-background-color: var(--hd-yellow)
  card-background-color: var(--hd-white)
  lovelace-background: var(--hd-yellow)
  clear-background-color: var(--hd-yellow)

  # ---------------------------------------------------------------------------
  # 4. STATUS COLORS  (foreground text/icon on the yellow card -> black)
  # ---------------------------------------------------------------------------
  # Foreground colors -> black so they stay legible on the yellow card surface
  # (white-on-yellow is a forbidden low-contrast pair).
  error-color: var(--hd-black)
  warning-color: var(--hd-black)
  success-color: var(--hd-black)
  info-color: var(--hd-black)
  # The rgb-* variants only drive ha-alert's translucent background WASH (not the
  # foreground) -> red wash gives a visible caution tint behind the black text on
  # the yellow card. Not a text/fg pairing; do not "fix" these to black.
  rgb-error-color: 255, 0, 0
  rgb-warning-color: 255, 0, 0
  rgb-success-color: 255, 0, 0
  rgb-info-color: 255, 0, 0

  # ---------------------------------------------------------------------------
  # 5. CARDS  (white body, thick black frame, NO shadow, red title bar)
  # ---------------------------------------------------------------------------
  # White window bodies on the yellow desktop. Windows 3.1 had no drop shadows
  # -> box-shadow: none (flat). The 5px black border is the "active window" thick
  # frame. The red title-bar strip + its white header text are painted by
  # card-mod-card (section 18); the header-color token below is the white text
  # that sits on that red strip.
  ha-card-background: var(--hd-white)
  ha-card-border-color: var(--hd-black)
  ha-card-border-width: 5px
  ha-card-border-radius: 0px
  ha-card-box-shadow: none
  ha-card-header-color: var(--hd-white)
  ha-card-header-font-size: 24px
  ha-card-state-icon-color: var(--hd-black)
  paper-card-background-color: var(--hd-white)
  paper-card-header-color: var(--hd-white)
  paper-listbox-background-color: var(--hd-white)

  # ---------------------------------------------------------------------------
  # 6. APP HEADER + VIEW TABS / TOOLBAR  (BLACK title bar, white text, yellow active)
  # ---------------------------------------------------------------------------
  # The top title bar is BLACK (the reference's active-window title-bar color),
  # not red — white text, yellow active accent. Sidebar nav + card title bars
  # stay red.
  app-header-background-color: var(--hd-black)
  app-header-text-color: var(--hd-white)
  app-header-selection-bar-color: var(--hd-yellow)
  app-header-edit-background-color: var(--hd-red-dk)
  app-header-edit-text-color: var(--hd-white)
  toolbar-background-color: var(--hd-black)
  header-height: 56px

  # top view tabs (mwc/mdc tab bar) — on the black header: white text, yellow active
  mdc-tab-text-label-color-default: var(--hd-white)
  mdc-tab-color-default: var(--hd-white)
  ha-tab-active-text-color: var(--hd-yellow)
  ha-tab-indicator-color: var(--hd-yellow)

  # ---------------------------------------------------------------------------
  # 7. SIDEBAR  (red chrome; selected item = black tile with yellow icon/text)
  # ---------------------------------------------------------------------------
  sidebar-background-color: var(--hd-red)
  sidebar-icon-color: var(--hd-white)
  sidebar-text-color: var(--hd-white)
  sidebar-title-color: var(--hd-white)
  sidebar-selected-background-color: var(--hd-black)
  sidebar-selected-icon-color: var(--hd-yellow)
  sidebar-selected-text-color: var(--hd-yellow)

  # ---------------------------------------------------------------------------
  # 8. STATE & DOMAIN ICON COLORS  (icons sit on the yellow card body now)
  #    Inactive icons on yellow -> black; active -> red; unavailable -> grey.
  # ---------------------------------------------------------------------------
  state-icon-color: var(--hd-black)
  state-icon-active-color: var(--hd-red)
  state-icon-unavailable-color: var(--hd-grey)

  state-on-color: var(--hd-red)
  state-off-color: var(--hd-black)
  state-home-color: var(--hd-red)
  state-not_home-color: var(--hd-black)
  state-active-color: var(--hd-red)
  state-unavailable-color: var(--hd-grey)
  state-unknown-color: var(--hd-black)
  state-idle-color: var(--hd-black)

  # climate state colors (active modes -> red on yellow; off/idle -> black)
  state-climate-auto-color: var(--hd-red)
  state-climate-eco-color: var(--hd-red)
  state-climate-cool-color: var(--hd-red)
  state-climate-heat-color: var(--hd-red)
  state-climate-manual-color: var(--hd-red)
  state-climate-off-color: var(--hd-black)
  state-climate-fan_only-color: var(--hd-red)
  state-climate-dry-color: var(--hd-red)
  state-climate-idle-color: var(--hd-black)

  # per-domain entity RGB colors (active entities glow RED on the yellow body;
  # off / not-home / unlocked / disarmed states -> black)
  rgb-state-default-color: 255, 0, 0
  rgb-state-light-color: 255, 0, 0
  rgb-state-switch-color: 255, 0, 0
  rgb-state-fan-color: 255, 0, 0
  rgb-state-cover-color: 255, 0, 0
  rgb-state-climate-color: 255, 0, 0
  rgb-state-entity-color: 255, 0, 0
  rgb-state-binary-sensor-color: 255, 0, 0
  rgb-state-sensor-color: 255, 0, 0
  rgb-state-media-player-color: 255, 0, 0
  rgb-state-remote-color: 255, 0, 0
  rgb-state-script-color: 255, 0, 0
  rgb-state-scene-color: 255, 0, 0
  rgb-state-automation-color: 255, 0, 0
  rgb-state-siren-color: 255, 0, 0
  rgb-state-update-color: 255, 0, 0
  rgb-state-vacuum-color: 255, 0, 0
  rgb-state-humidifier-color: 255, 0, 0
  rgb-state-lock-locked-color: 255, 0, 0
  rgb-state-lock-unlocked-color: 0, 0, 0
  rgb-state-lock-pending-color: 0, 0, 0
  rgb-state-lock-jammed-color: 255, 0, 0
  rgb-state-alarm-armed-color: 255, 0, 0
  rgb-state-alarm-arming-color: 255, 0, 0
  rgb-state-alarm-pending-color: 0, 0, 0
  rgb-state-alarm-triggered-color: 255, 0, 0
  rgb-state-alarm-disarmed-color: 0, 0, 0
  rgb-state-person-home-color: 255, 0, 0
  rgb-state-person-not-home-color: 0, 0, 0
  rgb-state-person-zone-color: 255, 0, 0

  # generic rgb helpers a few cards read directly
  rgb-primary-color: 255, 0, 0
  rgb-accent-color: 255, 255, 0
  rgb-primary-text-color: 0, 0, 0
  rgb-secondary-text-color: 0, 0, 0
  rgb-text-primary-color: 0, 0, 0
  rgb-card-background-color: 255, 255, 255
  rgb-primary-background-color: 255, 255, 0
  rgb-secondary-background-color: 255, 255, 0
  rgb-disabled-text-color: 128, 128, 128

  # ---------------------------------------------------------------------------
  # 9. INPUTS  (transparent on the yellow body -> BLACK ink, hard BLACK border)
  # ---------------------------------------------------------------------------
  # legacy input-*
  input-fill-color: transparent
  input-disabled-fill-color: transparent
  input-ink-color: var(--hd-black)
  input-label-ink-color: var(--hd-black)
  input-disabled-ink-color: var(--hd-grey)
  input-idle-line-color: var(--hd-black)
  input-hover-line-color: var(--hd-black)
  input-disabled-line-color: var(--hd-grey)
  input-outlined-idle-border-color: var(--hd-black)
  input-outlined-hover-border-color: var(--hd-black)
  input-outlined-disabled-border-color: var(--hd-grey)
  input-dropdown-icon-color: var(--hd-black)

  # MDC text field
  mdc-text-field-fill-color: transparent
  mdc-text-field-disabled-fill-color: transparent
  mdc-text-field-ink-color: var(--hd-black)
  mdc-text-field-label-ink-color: var(--hd-black)
  mdc-text-field-disabled-ink-color: var(--hd-grey)
  mdc-text-field-idle-line-color: var(--hd-black)
  mdc-text-field-hover-line-color: var(--hd-black)
  mdc-text-field-disabled-line-color: var(--hd-grey)
  mdc-text-field-outlined-idle-border-color: var(--hd-black)
  mdc-text-field-outlined-hover-border-color: var(--hd-black)
  mdc-text-field-outlined-disabled-border-color: var(--hd-grey)

  # MDC select
  mdc-select-fill-color: transparent
  mdc-select-disabled-fill-color: transparent
  mdc-select-ink-color: var(--hd-black)
  mdc-select-label-ink-color: var(--hd-black)
  mdc-select-disabled-ink-color: var(--hd-grey)
  mdc-select-idle-line-color: var(--hd-black)
  mdc-select-hover-line-color: var(--hd-black)
  mdc-select-dropdown-icon-color: var(--hd-black)
  mdc-select-disabled-dropdown-icon-color: var(--hd-grey)
  mdc-select-outlined-idle-border-color: var(--hd-black)
  mdc-select-outlined-hover-border-color: var(--hd-black)
  mdc-select-outlined-disabled-border-color: var(--hd-grey)

  # legacy paper input
  paper-input-container-color: var(--hd-black)
  paper-input-container-focus-color: var(--hd-red)
  paper-input-container-input-color: var(--hd-black)
  paper-input-container-input: var(--hd-black)
  paper-input-container-shared-input-style_-_color: var(--hd-black)

  # ---------------------------------------------------------------------------
  # 10. DIALOGS / MORE-INFO  (yellow surface, black ink; red more-info header)
  # ---------------------------------------------------------------------------
  mdc-dialog-heading-ink-color: var(--hd-black)
  mdc-dialog-content-ink-color: var(--hd-black)
  mdc-dialog-scroll-divider-color: var(--hd-black)
  mdc-dialog-scrim-color: rgba(0, 0, 0, 0.6)
  dialog-backdrop-filter: none
  ha-dialog-border-radius: 0px
  ha-dialog-surface-background: var(--hd-white)
  more-info-header-background: var(--hd-red)
  more-info-header-color: var(--hd-white)

  # ---------------------------------------------------------------------------
  # 11. SWITCHES / TOGGLES / SLIDERS  (sit on the yellow card body)
  # ---------------------------------------------------------------------------
  # Switch ON  = black track + yellow thumb (filled, obvious).
  # Switch OFF = silver track + black thumb (empty box) — reads on the white card.
  switch-checked-color: var(--hd-yellow)
  switch-checked-button-color: var(--hd-yellow)
  switch-checked-track-color: var(--hd-black)
  switch-unchecked-color: var(--hd-black)
  switch-unchecked-button-color: var(--hd-black)
  switch-unchecked-track-color: "#B0B0B0"

  paper-toggle-button-checked-button-color: var(--hd-yellow)
  paper-toggle-button-checked-bar-color: var(--hd-black)
  paper-toggle-button-unchecked-button-color: var(--hd-black)
  paper-toggle-button-unchecked-bar-color: "#B0B0B0"

  # ha-slider / md-slider / legacy paper-slider — black track (reads on yellow),
  # red fill/knob (active accent on yellow).
  ha-slider-color: var(--hd-red)
  slider-color: var(--hd-red)
  slider-secondary-color: var(--hd-white)
  slider-track-color: var(--hd-black)
  slider-bar-color: var(--hd-black)
  paper-slider-active-color: var(--hd-red)
  paper-slider-secondary-color: var(--hd-white)
  paper-slider-container-color: var(--hd-black)
  paper-slider-knob-color: var(--hd-red)
  paper-slider-knob-start-color: var(--hd-red)
  paper-slider-pin-color: var(--hd-black)         # pin bubble background
  paper-slider-font-color: var(--hd-yellow)       # pin text (yellow on black)
  paper-slider-disabled-active-color: var(--hd-grey)

  # ha-control-* (tile card buttons / sliders / switches)
  ha-control-slider-color: var(--hd-red)
  ha-control-slider-background: var(--hd-black)
  ha-control-slider-background-opacity: 1
  ha-control-switch-on-color: var(--hd-red)
  ha-control-switch-off-color: var(--hd-white)
  ha-control-switch-background-opacity: 1
  # (Tile/area control buttons are styled as Windows buttons via card-mod-card
  # in section 18 — the ha-control-button component redefines its own vars on
  # :host, so plain tokens here can't reach it.)

  # ---------------------------------------------------------------------------
  # 12. MENUS / DROPDOWNS  (white list surface, black text — classic Win combo)
  #     Selected/active row = red bar with white text (see md-sys containers).
  # ---------------------------------------------------------------------------
  mdc-menu-surface-fill-color: var(--hd-white)
  mdc-menu-ink-color: var(--hd-black)
  paper-listbox-color: var(--hd-black)
  paper-item-icon-color: var(--hd-black)
  paper-item-icon-active-color: var(--hd-red)
  paper-item-selected-background-color: var(--hd-red)
  paper-item-min-height: 40px
  ha-select-height: 56px

  # ---------------------------------------------------------------------------
  # 13. CHIPS / BADGES / TOASTS  (inverse: black tile, yellow text — pops on yellow)
  # ---------------------------------------------------------------------------
  # label badges: black pill, yellow text/border (yellow on black)
  label-badge-background-color: var(--hd-black)
  label-badge-text-color: var(--hd-yellow)
  label-badge-border-color: var(--hd-yellow)
  label-badge-red: var(--hd-red)
  label-badge-yellow: var(--hd-yellow)
  label-badge-green: var(--hd-yellow)
  label-badge-blue: var(--hd-white)
  label-badge-grey: var(--hd-grey)

  # assist / filter chips
  ha-chip-background-color: var(--hd-black)
  ha-chip-text-color: var(--hd-yellow)
  ha-assist-chip-container-color: var(--hd-black)
  ha-assist-chip-active-container-color: var(--hd-red)
  ha-assist-chip-filled-container-color: var(--hd-black)

  # toast / snackbar -> inverse surface (black tile, yellow text)
  ha-toast-color: var(--hd-yellow)
  ha-toast-background-color: var(--hd-black)

  # ---------------------------------------------------------------------------
  # 14. CODE EDITOR + MARKDOWN  (black on white; dark garish syntax palette)
  #     Syntax token hues intentionally step outside the red/yellow/black set
  #     so tokens stay distinguishable AND legible on the white code surface.
  # ---------------------------------------------------------------------------
  code-editor-background-color: var(--hd-white)
  # Inline <code> / highlight chips (markdown, HACS version + install-path boxes,
  # etc.) -> WHITE box: their text now inherits the surrounding BLACK body color
  # (yellow card), so a white chip background gives readable black-on-white. (The
  # code EDITOR above stays white too — it sets its own dark syntax colors via
  # the codemirror-* tokens below.)
  markdown-code-background-color: "#D9D9D9"
  code-editor-gutter-color: var(--hd-white)
  codemirror-gutters-background-color: var(--hd-white)
  codemirror-linenumber-color: var(--hd-grey)
  codemirror-cursor: var(--hd-black)
  codemirror-selected: "#FFFF00"
  codemirror-meta: "#000000"
  codemirror-property: "#7A0000"
  codemirror-keyword: "#B00000"
  codemirror-atom: "#7A00B0"
  codemirror-number: "#0000B0"
  codemirror-def: "#000000"
  codemirror-variable: "#000000"
  codemirror-variable-2: "#7A3E00"
  codemirror-variable-3: "#7A3E00"
  codemirror-string: "#006400"
  codemirror-string-2: "#006400"
  codemirror-comment: "#808080"
  codemirror-tag: "#B00000"
  codemirror-attribute: "#7A3E00"
  codemirror-qualifier: "#7A0000"
  codemirror-operator: "#000000"
  codemirror-builtin: "#0000B0"
  codemirror-bracket: "#000000"
  codemirror-header: "#B00000"
  codemirror-link: "#0000B0"

  # ---------------------------------------------------------------------------
  # 15. MATERIAL 3 SYSTEM TOKENS  (--md-sys-color-*)
  #     The modern gap: newer buttons/dialogs/menus/chips read these. Every
  #     `on-*` value is the foreground drawn ON the matching surface.
  #     Surfaces are yellow (on -> black); the interactive primary/secondary/
  #     tertiary accents are RED (on -> white); high-elevation containers
  #     (menus / dialogs) are white (on -> black); outlines are black.
  # ---------------------------------------------------------------------------
  md-sys-color-primary: var(--hd-red)
  md-sys-color-on-primary: var(--hd-white)
  md-sys-color-primary-container: var(--hd-red-dk)
  md-sys-color-on-primary-container: var(--hd-white)
  md-sys-color-inverse-primary: var(--hd-yellow)

  md-sys-color-secondary: var(--hd-red)
  md-sys-color-on-secondary: var(--hd-white)
  md-sys-color-secondary-container: var(--hd-red)
  md-sys-color-on-secondary-container: var(--hd-white)

  md-sys-color-tertiary: var(--hd-red)
  md-sys-color-on-tertiary: var(--hd-white)
  md-sys-color-tertiary-container: var(--hd-red)
  md-sys-color-on-tertiary-container: var(--hd-white)

  md-sys-color-surface: var(--hd-white)
  md-sys-color-on-surface: var(--hd-black)
  md-sys-color-surface-variant: var(--hd-white)
  md-sys-color-on-surface-variant: var(--hd-black)
  md-sys-color-surface-tint: var(--hd-white)
  md-sys-color-surface-dim: var(--hd-white)
  md-sys-color-surface-bright: var(--hd-white)
  md-sys-color-surface-container-lowest: var(--hd-white)
  md-sys-color-surface-container-low: var(--hd-white)
  md-sys-color-surface-container: var(--hd-white)
  md-sys-color-surface-container-high: var(--hd-white)
  md-sys-color-surface-container-highest: var(--hd-white)

  md-sys-color-background: var(--hd-yellow)
  md-sys-color-on-background: var(--hd-black)

  md-sys-color-outline: var(--hd-black)
  md-sys-color-outline-variant: var(--hd-black)

  md-sys-color-error: var(--hd-black)
  md-sys-color-on-error: var(--hd-yellow)
  md-sys-color-error-container: var(--hd-red-dk)
  md-sys-color-on-error-container: var(--hd-white)

  md-sys-color-inverse-surface: var(--hd-black)
  md-sys-color-inverse-on-surface: var(--hd-yellow)

  md-sys-color-primary-fixed: var(--hd-red)
  md-sys-color-primary-fixed-dim: var(--hd-red-dk)
  md-sys-color-on-primary-fixed: var(--hd-white)
  md-sys-color-on-primary-fixed-variant: var(--hd-white)
  md-sys-color-secondary-fixed: var(--hd-red)
  md-sys-color-secondary-fixed-dim: var(--hd-red-dk)
  md-sys-color-on-secondary-fixed: var(--hd-white)
  md-sys-color-on-secondary-fixed-variant: var(--hd-white)
  md-sys-color-tertiary-fixed: var(--hd-red)
  md-sys-color-tertiary-fixed-dim: var(--hd-red-dk)
  md-sys-color-on-tertiary-fixed: var(--hd-white)
  md-sys-color-on-tertiary-fixed-variant: var(--hd-white)

  md-sys-color-shadow: var(--hd-black)
  md-sys-color-scrim: var(--hd-black)

  # ---------------------------------------------------------------------------
  # 16. LEGACY MDC THEME ALIASES  (--mdc-theme-*)
  # ---------------------------------------------------------------------------
  mdc-theme-primary: var(--hd-red)
  mdc-theme-on-primary: var(--hd-white)
  mdc-theme-secondary: var(--hd-red)
  mdc-theme-on-secondary: var(--hd-white)
  mdc-theme-surface: var(--hd-white)
  mdc-theme-on-surface: var(--hd-black)
  mdc-theme-background: var(--hd-yellow)
  mdc-theme-error: var(--hd-red)
  mdc-theme-text-primary-on-background: var(--hd-black)
  mdc-theme-text-secondary-on-background: var(--hd-black)
  mdc-theme-text-hint-on-background: var(--hd-black)
  mdc-theme-text-disabled-on-background: var(--hd-grey)
  mdc-theme-text-icon-on-background: var(--hd-black)

  # ===== HA 2026 semantic color tokens (--ha-color-*) =====
  # HA 2026.7 introduced a new semantic design-token layer, --ha-color-*, that
  # modern components (ha-switch, buttons, chips, sliders, tiles) read from
  # INSTEAD of the classic / MDC / M3 vars above. Without these they fall back
  # to HA's default teal/grey palette (e.g. switch "on" was cyan #009AC7).
  # In a themes file these are set WITHOUT the leading `--`.
  #
  # Form/input backgrounds -> yellow (the card body) so the pickers' value text
  # (inherited from --ha-color-text-primary, now BLACK) reads black-on-yellow.
  ha-color-form-background: var(--hd-white)
  ha-color-form-background-hover: var(--hd-white)
  ha-color-form-background-disabled: "#D9D9D9"

  # ROLE FILLS — IMPORTANT: for the `normal` and `quiet` prominences the fill
  # color ALSO doubles as plain/outlined button TEXT drawn on the yellow page
  # (Web Awesome renders the fill color as the label color), so those must be
  # dark (red-dk) on the yellow body. Only the `-loud` prominence is a real
  # filled surface: primary-loud = red (white text); danger/warning/success-loud
  # = black (yellow text); neutral-loud = black (white text).
  # primary role
  ha-color-fill-primary-loud-resting: var(--hd-red)
  ha-color-fill-primary-loud-hover: "#D40000"
  ha-color-fill-primary-loud-active: var(--hd-red-dk)
  ha-color-fill-primary-normal-resting: var(--hd-red-dk)
  ha-color-fill-primary-normal-hover: "#8F0000"
  ha-color-fill-primary-normal-active: var(--hd-red-dk)
  ha-color-fill-primary-quiet-resting: var(--hd-red-dk)
  ha-color-fill-primary-quiet-hover: "#8F0000"
  ha-color-fill-primary-quiet-active: var(--hd-red-dk)
  ha-color-border-primary-loud: var(--hd-black)
  ha-color-border-primary-normal: var(--hd-black)
  ha-color-border-primary-quiet: var(--hd-black)
  ha-color-on-primary-loud: var(--hd-white)
  ha-color-on-primary-normal: var(--hd-white)
  ha-color-on-primary-quiet: var(--hd-white)

  # neutral role -> black fills / white on ; quiet = dark-red hover tint
  ha-color-fill-neutral-loud-resting: var(--hd-black)
  ha-color-fill-neutral-loud-hover: "#1A1A1A"
  ha-color-fill-neutral-loud-active: var(--hd-black)
  ha-color-fill-neutral-normal-resting: var(--hd-black)
  ha-color-fill-neutral-normal-hover: "#1A1A1A"
  ha-color-fill-neutral-normal-active: var(--hd-black)
  ha-color-fill-neutral-quiet-resting: var(--hd-red-dk)
  ha-color-fill-neutral-quiet-hover: "#8F0000"
  ha-color-fill-neutral-quiet-active: var(--hd-red-dk)
  ha-color-border-neutral-loud: var(--hd-black)
  ha-color-border-neutral-normal: var(--hd-black)
  ha-color-border-neutral-quiet: var(--hd-black)
  ha-color-on-neutral-loud: var(--hd-white)
  ha-color-on-neutral-normal: var(--hd-white)
  ha-color-on-neutral-quiet: var(--hd-white)

  # status roles danger/warning/success -> loud black + yellow (caution-tape),
  # normal/quiet dark-red + white
  ha-color-fill-danger-loud-resting: var(--hd-black)
  ha-color-fill-danger-loud-hover: "#1A1A1A"
  ha-color-fill-danger-loud-active: var(--hd-black)
  ha-color-fill-danger-normal-resting: var(--hd-red-dk)
  ha-color-fill-danger-normal-hover: "#8F0000"
  ha-color-fill-danger-normal-active: var(--hd-red-dk)
  ha-color-fill-danger-quiet-resting: var(--hd-red-dk)
  ha-color-fill-danger-quiet-hover: "#8F0000"
  ha-color-fill-danger-quiet-active: var(--hd-red-dk)
  ha-color-border-danger-loud: var(--hd-black)
  ha-color-border-danger-normal: var(--hd-black)
  ha-color-border-danger-quiet: var(--hd-black)
  ha-color-on-danger-loud: var(--hd-yellow)
  ha-color-on-danger-normal: var(--hd-white)
  ha-color-on-danger-quiet: var(--hd-white)
  ha-color-fill-warning-loud-resting: var(--hd-black)
  ha-color-fill-warning-loud-hover: "#1A1A1A"
  ha-color-fill-warning-loud-active: var(--hd-black)
  ha-color-fill-warning-normal-resting: var(--hd-red-dk)
  ha-color-fill-warning-normal-hover: "#8F0000"
  ha-color-fill-warning-normal-active: var(--hd-red-dk)
  ha-color-fill-warning-quiet-resting: var(--hd-red-dk)
  ha-color-fill-warning-quiet-hover: "#8F0000"
  ha-color-fill-warning-quiet-active: var(--hd-red-dk)
  ha-color-border-warning-loud: var(--hd-black)
  ha-color-border-warning-normal: var(--hd-black)
  ha-color-border-warning-quiet: var(--hd-black)
  ha-color-on-warning-loud: var(--hd-yellow)
  ha-color-on-warning-normal: var(--hd-white)
  ha-color-on-warning-quiet: var(--hd-white)
  ha-color-fill-success-loud-resting: var(--hd-black)
  ha-color-fill-success-loud-hover: "#1A1A1A"
  ha-color-fill-success-loud-active: var(--hd-black)
  ha-color-fill-success-normal-resting: var(--hd-red-dk)
  ha-color-fill-success-normal-hover: "#8F0000"
  ha-color-fill-success-normal-active: var(--hd-red-dk)
  ha-color-fill-success-quiet-resting: var(--hd-red-dk)
  ha-color-fill-success-quiet-hover: "#8F0000"
  ha-color-fill-success-quiet-active: var(--hd-red-dk)
  ha-color-border-success-loud: var(--hd-black)
  ha-color-border-success-normal: var(--hd-black)
  ha-color-border-success-quiet: var(--hd-black)
  ha-color-on-success-loud: var(--hd-yellow)
  ha-color-on-success-normal: var(--hd-white)
  ha-color-on-success-quiet: var(--hd-white)

  # surfaces -> yellow family (black text); inverted -> black (toasts/tooltips)
  ha-color-surface-default: var(--hd-white)
  ha-color-surface-low: var(--hd-white)
  ha-color-surface-lower: var(--hd-white)
  ha-color-surface-default-inverted: var(--hd-black)
  ha-color-surface-low-inverted: "#141414"
  ha-color-surface-lower-inverted: var(--hd-black)
  ha-color-on-surface-default: var(--hd-black)

  # text
  ha-color-text-primary: var(--hd-black)
  ha-color-text-secondary: var(--hd-black)
  ha-color-text-disabled: "#6E6E6E"
  ha-color-text-link: var(--hd-red)
  ha-color-text-primary-inverted: var(--hd-white)
  ha-color-text-secondary-inverted: "#E0E0E0"

  # focus ring -> black so it reads on BOTH the yellow body and the red chrome
  # (a yellow ring vanished on the yellow cards).
  ha-color-focus: var(--hd-black)

  # ha-switch — pin colors directly (the primary-role fill is red, but the toggle
  # should read as a filled black/yellow control on the yellow card).
  # ON  = black track + yellow thumb.
  ha-switch-checked-background-color: var(--hd-black)
  ha-switch-checked-background-color-hover: "#1A1A1A"
  ha-switch-checked-thumb-background-color: var(--hd-yellow)
  ha-switch-checked-thumb-border-color: var(--hd-black)
  ha-switch-checked-border-color: var(--hd-black)
  # OFF = silver track + black thumb (empty box) — visible on the white card body.
  ha-switch-background-color: "#B0B0B0"
  ha-switch-background-color-hover: "#A0A0A0"
  ha-switch-thumb-background-color: var(--hd-black)
  ha-switch-thumb-border-color: var(--hd-black)
  # DISABLED: dim it so disabled toggles are visually distinct from off.
  ha-switch-disabled-opacity: "0.45"

  # ===========================================================================
  # 18. BOXY INPUTS + CARD-MOD  (square corners, red title bars, Windows buttons)
  # ===========================================================================
  # Square corners everywhere via plain variables (robust; these cascade into
  # shadow DOM). Win 3.1 controls were hard rectangles, never rounded.
  ha-border-radius-sm: "0"
  ha-border-radius-md: "0"
  ha-border-radius-lg: "0"
  ha-border-radius-xl: "0"
  wa-border-radius-s: "0"
  wa-border-radius-m: "0"
  wa-border-radius-l: "0"
  wa-form-control-border-radius: "0"
  wa-panel-border-radius: "0"
  mdc-shape-small: "0"
  mdc-shape-medium: "0"
  mdc-shape-large: "0"
  ha-input-search-border-radius: "0"
  # ha-button / ha-fab / chips override the shared radius on their own :host to
  # var(--ha-border-radius-pill) (9999px), so they need their specific tokens
  # squared (the "Add" buttons + the "Add integration" FAB were pills).
  ha-button-border-radius: "0"
  ha-fab-border-radius: "0"
  mdc-fab-border-radius: "0"
  ha-assist-chip-border-radius: "0"
  # Square the "circle" + "pill" radii too: the profile avatar (ha-user-badge),
  # the colored Settings-page icon tiles (ha-config-navigation-list), and count
  # badges all use these. (The transient circular hover ripple on icon buttons
  # is a hardcoded ha-button::after{border-radius:50%} that a token can't reach.)
  ha-border-radius-circle: "0"
  ha-border-radius-pill: "0"

  # --- card-mod (frontend module; see configuration.yaml -> extra_module_url) --
  #   * value MUST be a | STRING of card-mod YAML — a real YAML map => reload 500
  #   * "$" descends into an element's shadow root; "*$" into all children
  #   * the "." key is CSS for the current root
  card-mod-theme: hotdog-stand-theme

  # Thick single black rule under the black top title bar, separating it from the
  # yellow desktop. Target ONLY .toolbar (not .header too) — bordering both drew
  # a doubled line. card-mod-root styles the lovelace root shadow, where the
  # header/toolbar live. (Config panels use a different header not reached here.)
  card-mod-root-yaml: |
    ".": |
      .toolbar {
        border-bottom: 5px solid #000000 !important;
      }

  # Config-page search box gets a hard black border (the one high-value input a
  # variables-only theme cannot border — Material/Web-Awesome inputs hardcode
  # border:none). Config "Add / Ignore" buttons -> grey Windows buttons.
  card-mod-config-yaml: |
    "*$":
      "hass-tabs-subpage-data-table$":
        "ha-data-table$":
          "ha-input-search$":
            ".": |
              wa-input::part(base) { border: 2px solid #000000 !important; border-radius: 0 !important; }
      "ha-config-flow-card$":
        "ha-button$":
          ".": |
            .button {
              background: #C0C0C0 !important;
              color: #000000 !important;
              border: 2px outset #C0C0C0 !important;
              border-radius: 0 !important;
            }
  # Dialog action buttons (OK / Cancel / Submit / Save) -> Windows buttons too.
  card-mod-dialog-yaml: |
    "ha-button$":
      ".": |
        .button {
          background: #C0C0C0 !important;
          color: #000000 !important;
          border: 2px outset #C0C0C0 !important;
          border-radius: 0 !important;
        }
  # Sidebar (card-mod): HA hardcodes body{font-family:Roboto...} (not a variable)
  # and the sidebar inherits it, so the theme's font vars don't reach it — force
  # the pixel font on the sidebar host. Also kill the selected-item tint overlay
  # and flatten hover/focus background washes (the yellow focus OUTLINE stays).
  card-mod-sidebar-yaml: |
    ".": |
      :host { font-family: var(--hd-font) !important; }
      /* Thick black frame separating the red side menu from the yellow desktop
         (was a 1px hairline) — matches the window-frame weight. */
      :host { border-right: 5px solid #000000 !important; }
      /* The "Home Assistant" sidebar title draws from --primary-text-color
         (now black); force all sidebar chrome text white on the red panel. */
      :host { --primary-text-color: #FFFFFF !important; --secondary-text-color: #FFFFFF !important; }
      .title { color: #FFFFFF !important; }
      /* Sidebar TITLE ROW is a BLACK title bar (matches the black top header),
         with a thick black rule under it separating it from the red nav below. */
      .menu {
        background: #000000 !important;
        border-bottom: 5px solid #000000 !important;
      }
      ha-list-item-button.selected::before { opacity: 0 !important; background: none !important; }
      ha-list-item-button {
        --ha-list-item-focus-background: transparent !important;
        --ha-ripple-color: transparent !important;
      }
  # Per-card styling (card-mod-card runs on every card):
  #   1. The card HEADER becomes a classic red Windows title bar — red strip,
  #      white text, black bottom rule dividing it from the yellow body. Targets
  #      the card's own .card-header / .header (light DOM inside the card shadow).
  #   2. Tile/area control buttons -> silver Windows buttons (raised bevel, black
  #      icon). The ha-control-button component redefines its color vars on :host,
  #      so card-mod sets the host style directly. The descent no-ops on cards
  #      without control-button features. May need updating after major HA
  #      dashboard DOM changes.
  card-mod-card-yaml: |
    ".": |
      .card-header, .header, h1.card-header {
        background: #FF0000 !important;
        color: #FFFFFF !important;
        margin: 0 0 8px 0 !important;
        padding: 6px 16px !important;
        border-bottom: 5px solid #000000 !important;
      }
      /* Media-control card hardcodes white text (built for album-art/colored
         panels); on the yellow card body that was white-on-yellow. Paint its
         player area red so the white text/controls read white-on-red. */
      .player { background: #FF0000 !important; }
      .player, .player .icon-name, .player .top-info, .player .title,
      .player .artist, .player .current-time, .player .total-time {
        color: #FFFFFF !important;
      }
      /* count badge on the player's group/join button -> black pill, yellow text */
      .player .badge {
        background: #000000 !important;
        color: #FFFF00 !important;
        border-color: #FFFF00 !important;
      }
    "hui-card-features$":
      "hui-card-feature$":
        "*$":
          ".": |
            ha-control-button {
              background: #C0C0C0 !important;
              border: 2px outset #C0C0C0 !important;
              --control-button-icon-color: #000000 !important;
              --control-button-background-opacity: 0 !important;
            }
    # Kill the grey hover/press wash on tile + area cards. ha-ripple hardcodes
    # --md-ripple-*-opacity: 0.04/0.12 on its OWN :host, shadowing the theme's
    # root value, so it must be overridden ON the ripple element (inside
    # ha-tile-container's shadow). No-ops on cards without a tile container.
    "ha-tile-container$":
      ".": |
        ha-ripple {
          --md-ripple-hover-opacity: 0 !important;
          --md-ripple-pressed-opacity: 0 !important;
          --ha-ripple-hover-opacity: 0 !important;
          --ha-ripple-pressed-opacity: 0 !important;
        }
