# From https://github.com/
#
# Hotdog Stand Theme
#
hotdog-stand-theme:
  # Global
  hd-red: "#FF0000"
  hd-yellow: "#FFD700"
  hd-white: "#FFFFFF"
  hd-black: "#000000"
  hd-light-grey: rgb(192,192,192)
  hd-dark-grey: rgb(128,128,128)
  hd-find: rgb(255, 13, 194)
  primary-font-family: "'Trebuchet MS', sans-serif"


  # /* text */
  primary-text-color: var(--hd-white)
  secondary-text-color: var(--hd-white)
  text-primary-color: var(--hd-white)
  text-light-primary-color: var(--hd-black)
  disabled-text-color: var(--hd-dark-grey)

  # /* main interface colors */
  primary-color: var(--hd-red)
  dark-primary-color: var(--hd-red)
  light-primary-color: var(--hd-white)
  accent-color: var(--hd-yellow)
  divider-color: var(--hd-black)
  scrollbar-thumb-color: var(--hd-dark-grey)

  error-color: var(--hd-black)
  warning-color: var(--hd-black)
  success-color: var(--hd-black)
  info-color: var(--hd-black)


  # /* backgrounds */
  card-background-color: var(--hd-red)
  primary-background-color: var(--hd-red)
  secondary-background-color: var(--hd-yellow) #behind state

  # /* for header */
  header-height: 56px

  # Cards
  ha-card-state-icon-color: var(--hd-white)
  ha-card-border-width: 5px 
  ha-card-border-radius: 0px

  # /* states */
  state-icon-color: var(--hd-black)
  # /* an active state is anything that would require attention */
  state-icon-active-color: var(--hd-black)
  # /* an error state is anything that would be considered an error */
  # /* state-icon-error-color: #db4437; derived from error-color */

  state-on-color: var(--hd-black)
  state-off-color: var(--hd-black)
  state-home-color: var(--hd-black)
  state-not_home-color: var(--hd-black)
  # /* state-unavailable-color: #a0a0a0; derived from disabled-text-color */
  state-unknown-color: var(--hd-black)
  state-idle-color: var(--hd-black)


  # /* climate state colors */
  state-climate-auto-color: var(--hd-black)
  state-climate-eco-color: var(--hd-black)
  state-climate-cool-color: var(--hd-black)
  state-climate-heat-color: var(--hd-black)
  state-climate-manual-color: var(--hd-black)
  state-climate-off-color: var(--hd-black)
  state-climate-fan_only-color: var(--hd-black)
  state-climate-dry-color: var(--hd-black)
  state-climate-idle-color: var(--hd-black)


  #   # /* energy */
  # energy-grid-consumption-color: #488fc2;
  # energy-grid-return-color: #8353d1;
  # energy-solar-color: #ff9800;
  # energy-non-fossil-color: #0f9d58;
  # energy-battery-out-color: #4db6ac;
  # energy-battery-in-color: #f06292;
  # energy-gas-color: #8E021B;

  # # /* opacity for dark text on a light background */
  # dark-divider-opacity: 0.12;
  # dark-disabled-opacity: 0.38; # /* or hint text or icon */
  # dark-secondary-opacity: 0.54;
  # dark-primary-opacity: 0.87;

  # # /* opacity for light text on a dark background */
  # --light-divider-opacity: 0.12;
  # --light-disabled-opacity: 0.3; #/* or hint text or icon */
  # --light-secondary-opacity: 0.7;
  # --light-primary-opacity: 1.0;

  # # /* rgb */
  # rgb-primary-color: 3, 169, 244;
  # rgb-accent-color: 255, 152, 0;
  # rgb-primary-text-color: 33, 33, 33;
  # rgb-secondary-text-color: 114, 114, 114;
  # rgb-text-primary-color: 255, 255, 255;
  # rgb-card-background-color: 255, 255, 255;




  # /* input components */
  input-idle-line-color: var(--hd-black)
  input-hover-line-color: var(--hd-black)
  input-disabled-line-color: var(--hd-dark-grey)
  input-outlined-idle-border-color: var(--hd-black)
  input-outlined-hover-border-color: var(--hd-black)
  input-outlined-disabled-border-color: var(--hd-dark-grey)
  input-fill-color: var(--hd-white)
  input-disabled-fill-color: var(--hd-light-grey)
  input-ink-color: var(--hd-black)
  input-label-ink-color: var(--hd-black)
  input-disabled-ink-color: var(--hd-dark-grey)
  input-dropdown-icon-color: var(--hd-black)

  # /* Vaadin typography */
  # material-h6-font-size: 1.25rem;
  # material-small-font-size: 0.875rem;
  # material-caption-font-size: 0.75rem;
  # material-button-font-size: 0.875rem;


