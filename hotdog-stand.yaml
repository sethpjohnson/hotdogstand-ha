# =============================================================================
#  HOT DOG STAND  —  Home Assistant theme (target: HA 2026.7.2)
# =============================================================================
#  A faithful, garish re-creation of the Windows 3.1 "Hot Dog Stand" scheme.
#  Loud red / yellow / black. Single flat theme (no light/dark modes) so it
#  looks identically garish regardless of the viewer's system setting.
#
#  THE CONTRAST RULE (enforced on every foreground/background pairing):
#    Allowed ONLY:  white-on-red · black-on-yellow · yellow-on-black ·
#                   black-on-white (inputs / text-fields / code editor).
#    Forbidden:     white-on-yellow · yellow-on-red* · black-on-red.
#    (*yellow-on-red is used ONLY as deliberate active/accent emphasis and for
#     status colors, per the design spec — never for body text.)
#
#  Rule of thumb: any text/icon on a RED surface -> white (yellow if active);
#                 any text/icon on a YELLOW surface -> black.
# =============================================================================

hotdog-stand-theme:

  # ---------------------------------------------------------------------------
  # 0. BASE PALETTE TOKENS  (define once, reference via var(--hd-*) everywhere)
  # ---------------------------------------------------------------------------
  hd-red: "#FF0000"      # primary surface / background
  hd-yellow: "#FFD700"   # accent / active / selected
  hd-black: "#000000"    # borders; text on yellow
  hd-white: "#FFFFFF"    # text on red; input fill
  hd-red-dk: "#B00000"   # hover / pressed on red surfaces
  hd-grey: "#808080"     # disabled text / lines only

  # Windows 3.1 "MS Sans Serif" look via the pixelated webfont (loaded document-
  # wide by /local/hotdog-font.js — see frontend.extra_module_url). Falls back to
  # real MS Sans Serif on Windows, then Tahoma/Geneva. Code stays monospace.
  hd-font: "'Pixelated MS Sans Serif', 'MS Sans Serif', Tahoma, Geneva, sans-serif"
  ha-font-family-body: var(--hd-font)
  ha-font-family-heading: var(--hd-font)
  ha-font-family-longform: var(--hd-font)
  primary-font-family: var(--hd-font)
  paper-font-common-base_-_font-family: var(--hd-font)
  mdc-typography-font-family: var(--hd-font)

  # ---------------------------------------------------------------------------
  # 1. CORE INTERFACE COLORS
  # ---------------------------------------------------------------------------
  # primary-color must be YELLOW, not red: ha-tab (config sub-page tabs), text
  # links, and spinners all draw themselves in --primary-color directly, and on
  # the red surface red-on-red is invisible (the active tab vanished). Yellow is
  # the accent and reads on red. The FAB/primary buttons that use it as a
  # background pair it with a dark on-color, so this stays legible.
  primary-color: var(--hd-yellow)
  dark-primary-color: var(--hd-red-dk)
  light-primary-color: var(--hd-yellow)
  accent-color: var(--hd-yellow)
  divider-color: var(--hd-black)
  disabled-color: var(--hd-grey)
  disabled-text-color: var(--hd-grey)
  scrollbar-thumb-color: var(--hd-black)

  # ---------------------------------------------------------------------------
  # 2. TEXT COLORS  (default surface is red -> white text)
  # ---------------------------------------------------------------------------
  primary-text-color: var(--hd-white)
  secondary-text-color: var(--hd-white)
  text-primary-color: var(--hd-white)         # text drawn on the primary color
  text-light-primary-color: var(--hd-black)   # dark text variant (on light bg)
  text-medium-emphasis-color: var(--hd-white)

  # ---------------------------------------------------------------------------
  # 3. BACKGROUNDS
  # ---------------------------------------------------------------------------
  primary-background-color: var(--hd-red)
  secondary-background-color: var(--hd-red)
  card-background-color: var(--hd-red)
  lovelace-background: var(--hd-red)
  clear-background-color: var(--hd-red)

  # ---------------------------------------------------------------------------
  # 4. STATUS COLORS  (must contrast with the red card surface: yellow / white)
  # ---------------------------------------------------------------------------
  # Foreground text/icon colors -> white so they stay legible on the red surface
  # (yellow-on-red is a forbidden low-contrast pair).
  error-color: var(--hd-white)
  warning-color: var(--hd-white)
  success-color: var(--hd-white)
  info-color: var(--hd-white)
  # The rgb-* variants only drive ha-alert's translucent background WASH (not the
  # foreground) -> intentionally left yellow for a visible caution tint behind the
  # white text. Do not "fix" these to white; they are not a text/fg pairing.
  rgb-error-color: 255, 215, 0
  rgb-warning-color: 255, 215, 0
  rgb-success-color: 255, 255, 255
  rgb-info-color: 255, 255, 255

  # ---------------------------------------------------------------------------
  # 5. CARDS  (thick black border, no radius, hard retro shadow)
  # ---------------------------------------------------------------------------
  ha-card-background: var(--hd-red)
  ha-card-border-color: var(--hd-black)
  ha-card-border-width: 5px
  ha-card-border-radius: 0px
  ha-card-box-shadow: 4px 4px 0px 0px var(--hd-black)
  ha-card-header-color: var(--hd-white)
  ha-card-header-font-size: 24px
  ha-card-state-icon-color: var(--hd-white)
  paper-card-background-color: var(--hd-red)
  paper-card-header-color: var(--hd-white)
  paper-listbox-background-color: var(--hd-red)

  # ---------------------------------------------------------------------------
  # 6. APP HEADER + VIEW TABS / TOOLBAR  (red bar, white text, yellow selection)
  # ---------------------------------------------------------------------------
  app-header-background-color: var(--hd-red)
  app-header-text-color: var(--hd-white)
  app-header-selection-bar-color: var(--hd-yellow)
  app-header-edit-background-color: var(--hd-red-dk)
  app-header-edit-text-color: var(--hd-white)
  toolbar-background-color: var(--hd-red)
  header-height: 56px

  # top view tabs (mwc/mdc tab bar)
  mdc-tab-text-label-color-default: var(--hd-white)
  mdc-tab-color-default: var(--hd-white)
  ha-tab-active-text-color: var(--hd-yellow)
  ha-tab-indicator-color: var(--hd-yellow)

  # ---------------------------------------------------------------------------
  # 7. SIDEBAR  (red panel; selected item = black tile with yellow icon/text)
  # ---------------------------------------------------------------------------
  sidebar-background-color: var(--hd-red)
  sidebar-icon-color: var(--hd-white)
  sidebar-text-color: var(--hd-white)
  sidebar-title-color: var(--hd-white)
  sidebar-selected-background-color: var(--hd-black)
  sidebar-selected-icon-color: var(--hd-yellow)
  sidebar-selected-text-color: var(--hd-yellow)

  # ---------------------------------------------------------------------------
  # 8. STATE & DOMAIN ICON COLORS
  #    Inactive icons on red -> white; active -> yellow; unavailable -> grey.
  # ---------------------------------------------------------------------------
  state-icon-color: var(--hd-white)
  state-icon-active-color: var(--hd-yellow)
  state-icon-unavailable-color: var(--hd-grey)

  state-on-color: var(--hd-yellow)
  state-off-color: var(--hd-white)
  state-home-color: var(--hd-yellow)
  state-not_home-color: var(--hd-white)
  state-active-color: var(--hd-yellow)
  state-unavailable-color: var(--hd-grey)
  state-unknown-color: var(--hd-white)
  state-idle-color: var(--hd-white)

  # climate state colors
  state-climate-auto-color: var(--hd-yellow)
  state-climate-eco-color: var(--hd-yellow)
  state-climate-cool-color: var(--hd-yellow)
  state-climate-heat-color: var(--hd-yellow)
  state-climate-manual-color: var(--hd-yellow)
  state-climate-off-color: var(--hd-white)
  state-climate-fan_only-color: var(--hd-yellow)
  state-climate-dry-color: var(--hd-yellow)
  state-climate-idle-color: var(--hd-white)

  # per-domain entity RGB colors (active entities glow yellow across the UI)
  rgb-state-default-color: 255, 215, 0
  rgb-state-light-color: 255, 215, 0
  rgb-state-switch-color: 255, 215, 0
  rgb-state-fan-color: 255, 215, 0
  rgb-state-cover-color: 255, 215, 0
  rgb-state-climate-color: 255, 215, 0
  rgb-state-entity-color: 255, 215, 0
  rgb-state-binary-sensor-color: 255, 215, 0
  rgb-state-sensor-color: 255, 215, 0
  rgb-state-media-player-color: 255, 215, 0
  rgb-state-remote-color: 255, 215, 0
  rgb-state-script-color: 255, 215, 0
  rgb-state-scene-color: 255, 215, 0
  rgb-state-automation-color: 255, 215, 0
  rgb-state-siren-color: 255, 215, 0
  rgb-state-update-color: 255, 215, 0
  rgb-state-vacuum-color: 255, 215, 0
  rgb-state-humidifier-color: 255, 215, 0
  rgb-state-lock-locked-color: 255, 215, 0
  rgb-state-lock-unlocked-color: 255, 255, 255
  rgb-state-lock-pending-color: 255, 255, 255
  rgb-state-lock-jammed-color: 255, 215, 0
  rgb-state-alarm-armed-color: 255, 215, 0
  rgb-state-alarm-arming-color: 255, 215, 0
  rgb-state-alarm-pending-color: 255, 255, 255
  rgb-state-alarm-triggered-color: 255, 215, 0
  rgb-state-alarm-disarmed-color: 255, 255, 255
  rgb-state-person-home-color: 255, 215, 0
  rgb-state-person-not-home-color: 255, 255, 255
  rgb-state-person-zone-color: 255, 215, 0

  # generic rgb helpers a few cards read directly
  rgb-primary-color: 255, 0, 0
  rgb-accent-color: 255, 215, 0
  rgb-primary-text-color: 255, 255, 255
  rgb-secondary-text-color: 255, 255, 255
  rgb-text-primary-color: 255, 255, 255
  rgb-card-background-color: 255, 0, 0
  rgb-primary-background-color: 255, 0, 0
  rgb-secondary-background-color: 255, 0, 0
  rgb-disabled-text-color: 128, 128, 128

  # ---------------------------------------------------------------------------
  # 9. INPUTS  (MDC text-field & select + legacy paper/input) -> black on white
  # ---------------------------------------------------------------------------
  # legacy input-*
  input-fill-color: transparent
  input-disabled-fill-color: transparent
  input-ink-color: var(--hd-white)
  input-label-ink-color: var(--hd-white)
  input-disabled-ink-color: rgb(192,192,192)
  input-idle-line-color: var(--hd-white)
  input-hover-line-color: var(--hd-white)
  input-disabled-line-color: rgb(192,192,192)
  input-outlined-idle-border-color: var(--hd-black)
  input-outlined-hover-border-color: var(--hd-black)
  input-outlined-disabled-border-color: var(--hd-grey)
  input-dropdown-icon-color: var(--hd-black)

  # MDC text field
  mdc-text-field-fill-color: transparent
  mdc-text-field-disabled-fill-color: transparent
  mdc-text-field-ink-color: var(--hd-white)
  mdc-text-field-label-ink-color: var(--hd-white)
  mdc-text-field-disabled-ink-color: rgb(192,192,192)
  mdc-text-field-idle-line-color: var(--hd-white)
  mdc-text-field-hover-line-color: var(--hd-white)
  mdc-text-field-disabled-line-color: var(--hd-grey)
  mdc-text-field-outlined-idle-border-color: var(--hd-black)
  mdc-text-field-outlined-hover-border-color: var(--hd-black)
  mdc-text-field-outlined-disabled-border-color: var(--hd-grey)

  # MDC select
  mdc-select-fill-color: transparent
  mdc-select-disabled-fill-color: transparent
  mdc-select-ink-color: var(--hd-white)
  mdc-select-label-ink-color: var(--hd-white)
  mdc-select-disabled-ink-color: rgb(192,192,192)
  mdc-select-idle-line-color: var(--hd-white)
  mdc-select-hover-line-color: var(--hd-white)
  mdc-select-dropdown-icon-color: var(--hd-black)
  mdc-select-disabled-dropdown-icon-color: var(--hd-grey)
  mdc-select-outlined-idle-border-color: var(--hd-black)
  mdc-select-outlined-hover-border-color: var(--hd-black)
  mdc-select-outlined-disabled-border-color: var(--hd-grey)

  # legacy paper input
  paper-input-container-color: var(--hd-white)
  paper-input-container-focus-color: var(--hd-yellow)
  paper-input-container-input-color: var(--hd-white)
  paper-input-container-input: var(--hd-white)
  paper-input-container-shared-input-style_-_color: var(--hd-white)

  # ---------------------------------------------------------------------------
  # 10. DIALOGS / MORE-INFO  (red surface, white ink, black scrim)
  # ---------------------------------------------------------------------------
  mdc-dialog-heading-ink-color: var(--hd-white)
  mdc-dialog-content-ink-color: var(--hd-white)
  mdc-dialog-scroll-divider-color: var(--hd-black)
  mdc-dialog-scrim-color: rgba(0, 0, 0, 0.6)
  dialog-backdrop-filter: none
  ha-dialog-border-radius: 0px
  ha-dialog-surface-background: var(--hd-red)
  more-info-header-background: var(--hd-red-dk)
  more-info-header-color: var(--hd-white)

  # ---------------------------------------------------------------------------
  # 11. SWITCHES / TOGGLES / SLIDERS  (all sit on red -> white/yellow/black)
  # ---------------------------------------------------------------------------
  switch-checked-color: var(--hd-yellow)
  switch-checked-button-color: var(--hd-black)
  switch-checked-track-color: var(--hd-yellow)
  switch-unchecked-color: var(--hd-white)
  switch-unchecked-button-color: var(--hd-white)
  switch-unchecked-track-color: var(--hd-black)

  paper-toggle-button-checked-button-color: var(--hd-yellow)
  paper-toggle-button-checked-bar-color: var(--hd-white)
  paper-toggle-button-unchecked-button-color: var(--hd-white)
  paper-toggle-button-unchecked-bar-color: var(--hd-black)

  # ha-slider / md-slider / legacy paper-slider
  ha-slider-color: var(--hd-yellow)
  slider-color: var(--hd-yellow)
  slider-secondary-color: var(--hd-white)
  slider-track-color: var(--hd-black)
  slider-bar-color: var(--hd-black)
  paper-slider-active-color: var(--hd-yellow)
  paper-slider-secondary-color: var(--hd-white)
  paper-slider-container-color: var(--hd-black)
  paper-slider-knob-color: var(--hd-yellow)
  paper-slider-knob-start-color: var(--hd-yellow)
  paper-slider-pin-color: var(--hd-yellow)        # pin bubble background
  paper-slider-font-color: var(--hd-black)        # pin text (black on yellow)
  paper-slider-disabled-active-color: var(--hd-grey)

  # ha-control-* (tile card buttons / sliders / switches)
  ha-control-slider-color: var(--hd-yellow)
  ha-control-slider-background: var(--hd-black)
  ha-control-slider-background-opacity: 1
  ha-control-switch-on-color: var(--hd-yellow)
  ha-control-switch-off-color: var(--hd-white)
  ha-control-switch-background-opacity: 1
  # (Tile/area control buttons are styled as Windows buttons via card-mod-card
  # in section 18 — the ha-control-button component redefines its own vars on
  # :host, so plain tokens here can't reach it.)

  # ---------------------------------------------------------------------------
  # 12. MENUS / DROPDOWNS  (red surface, white text)
  # ---------------------------------------------------------------------------
  mdc-menu-surface-fill-color: var(--hd-red)
  mdc-menu-ink-color: var(--hd-white)
  paper-listbox-color: var(--hd-white)
  paper-item-icon-color: var(--hd-white)
  paper-item-icon-active-color: var(--hd-yellow)
  paper-item-selected-background-color: var(--hd-black)
  paper-item-min-height: 40px
  ha-select-height: 56px

  # ---------------------------------------------------------------------------
  # 13. CHIPS / BADGES / TOASTS
  # ---------------------------------------------------------------------------
  # label badges: black pill, yellow text/border (yellow on black)
  label-badge-background-color: var(--hd-black)
  label-badge-text-color: var(--hd-yellow)
  label-badge-border-color: var(--hd-yellow)
  label-badge-red: var(--hd-red)
  label-badge-yellow: var(--hd-yellow)
  label-badge-green: var(--hd-yellow)
  label-badge-blue: var(--hd-white)
  label-badge-grey: var(--hd-grey)

  # assist / filter chips
  ha-chip-background-color: var(--hd-black)
  ha-chip-text-color: var(--hd-yellow)
  ha-assist-chip-container-color: var(--hd-black)
  ha-assist-chip-active-container-color: var(--hd-yellow)
  ha-assist-chip-filled-container-color: var(--hd-black)

  # toast / snackbar -> inverse surface (black tile, yellow text)
  ha-toast-color: var(--hd-yellow)
  ha-toast-background-color: var(--hd-black)

  # ---------------------------------------------------------------------------
  # 14. CODE EDITOR + MARKDOWN  (black on white; dark garish syntax palette)
  #     Syntax token hues intentionally step outside the red/yellow/black set
  #     so tokens stay distinguishable AND legible on the white code surface.
  # ---------------------------------------------------------------------------
  code-editor-background-color: var(--hd-white)
  # Inline <code> / highlight chips (markdown, HACS version + install-path
  # boxes, etc.) must be BLACK, not white: their text inherits the surrounding
  # white-on-red color, so a white chip background is white-on-white. Black chip
  # + inherited white text is readable. (The code EDITOR above stays white — it
  # sets its own dark syntax colors via the codemirror-* tokens below.)
  markdown-code-background-color: var(--hd-black)
  code-editor-gutter-color: var(--hd-white)
  codemirror-gutters-background-color: var(--hd-white)
  codemirror-linenumber-color: var(--hd-grey)
  codemirror-cursor: var(--hd-black)
  codemirror-selected: "#FFD700"
  codemirror-meta: "#000000"
  codemirror-property: "#7A0000"
  codemirror-keyword: "#B00000"
  codemirror-atom: "#7A00B0"
  codemirror-number: "#0000B0"
  codemirror-def: "#000000"
  codemirror-variable: "#000000"
  codemirror-variable-2: "#7A3E00"
  codemirror-variable-3: "#7A3E00"
  codemirror-string: "#006400"
  codemirror-string-2: "#006400"
  codemirror-comment: "#808080"
  codemirror-tag: "#B00000"
  codemirror-attribute: "#7A3E00"
  codemirror-qualifier: "#7A0000"
  codemirror-operator: "#000000"
  codemirror-builtin: "#0000B0"
  codemirror-bracket: "#000000"
  codemirror-header: "#B00000"
  codemirror-link: "#0000B0"

  # ---------------------------------------------------------------------------
  # 15. MATERIAL 3 SYSTEM TOKENS  (--md-sys-color-*)
  #     The modern gap: newer buttons/dialogs/menus/chips read these. Every
  #     `on-*` value is the foreground drawn ON the matching surface.
  #     Surfaces are red (on -> white); primary/secondary/tertiary are the
  #     interactive yellow (on -> black); outlines are black.
  # ---------------------------------------------------------------------------
  md-sys-color-primary: var(--hd-yellow)
  md-sys-color-on-primary: var(--hd-black)
  md-sys-color-primary-container: var(--hd-red-dk)
  md-sys-color-on-primary-container: var(--hd-white)
  md-sys-color-inverse-primary: var(--hd-red)

  md-sys-color-secondary: var(--hd-yellow)
  md-sys-color-on-secondary: var(--hd-black)
  md-sys-color-secondary-container: var(--hd-red-dk)
  md-sys-color-on-secondary-container: var(--hd-white)

  md-sys-color-tertiary: var(--hd-yellow)
  md-sys-color-on-tertiary: var(--hd-black)
  md-sys-color-tertiary-container: var(--hd-red-dk)
  md-sys-color-on-tertiary-container: var(--hd-white)

  md-sys-color-surface: var(--hd-red)
  md-sys-color-on-surface: var(--hd-white)
  md-sys-color-surface-variant: var(--hd-red)
  md-sys-color-on-surface-variant: var(--hd-white)
  md-sys-color-surface-tint: var(--hd-red)
  md-sys-color-surface-dim: var(--hd-red-dk)
  md-sys-color-surface-bright: var(--hd-red)
  md-sys-color-surface-container-lowest: var(--hd-red-dk)
  md-sys-color-surface-container-low: var(--hd-red)
  md-sys-color-surface-container: var(--hd-red)
  md-sys-color-surface-container-high: var(--hd-red)
  md-sys-color-surface-container-highest: var(--hd-red)

  md-sys-color-background: var(--hd-red)
  md-sys-color-on-background: var(--hd-white)

  md-sys-color-outline: var(--hd-black)
  md-sys-color-outline-variant: var(--hd-black)

  md-sys-color-error: var(--hd-yellow)
  md-sys-color-on-error: var(--hd-black)
  md-sys-color-error-container: var(--hd-red-dk)
  md-sys-color-on-error-container: var(--hd-white)

  md-sys-color-inverse-surface: var(--hd-black)
  md-sys-color-inverse-on-surface: var(--hd-yellow)

  md-sys-color-primary-fixed: var(--hd-yellow)
  md-sys-color-primary-fixed-dim: var(--hd-yellow)
  md-sys-color-on-primary-fixed: var(--hd-black)
  md-sys-color-on-primary-fixed-variant: var(--hd-black)
  md-sys-color-secondary-fixed: var(--hd-yellow)
  md-sys-color-secondary-fixed-dim: var(--hd-yellow)
  md-sys-color-on-secondary-fixed: var(--hd-black)
  md-sys-color-on-secondary-fixed-variant: var(--hd-black)
  md-sys-color-tertiary-fixed: var(--hd-yellow)
  md-sys-color-tertiary-fixed-dim: var(--hd-yellow)
  md-sys-color-on-tertiary-fixed: var(--hd-black)
  md-sys-color-on-tertiary-fixed-variant: var(--hd-black)

  md-sys-color-shadow: var(--hd-black)
  md-sys-color-scrim: var(--hd-black)

  # ---------------------------------------------------------------------------
  # 16. LEGACY MDC THEME ALIASES  (--mdc-theme-*)
  # ---------------------------------------------------------------------------
  mdc-theme-primary: var(--hd-yellow)
  mdc-theme-on-primary: var(--hd-black)
  mdc-theme-secondary: var(--hd-yellow)
  mdc-theme-on-secondary: var(--hd-black)
  mdc-theme-surface: var(--hd-red)
  mdc-theme-on-surface: var(--hd-white)
  mdc-theme-background: var(--hd-red)
  mdc-theme-error: var(--hd-yellow)
  mdc-theme-text-primary-on-background: var(--hd-white)
  mdc-theme-text-secondary-on-background: var(--hd-white)
  mdc-theme-text-hint-on-background: var(--hd-white)
  mdc-theme-text-disabled-on-background: var(--hd-grey)
  mdc-theme-text-icon-on-background: var(--hd-white)

  # ===== HA 2026 semantic color tokens (--ha-color-*) =====
  # HA 2026.7 introduced a new semantic design-token layer, --ha-color-*, that
  # modern components (ha-switch, buttons, chips, sliders, tiles) read from
  # INSTEAD of the classic / MDC / M3 vars above. Without these they fall back
  # to HA's default teal/grey palette (e.g. switch "on" was cyan #009AC7).
  # In a themes file these are set WITHOUT the leading `--`.
  #
  # NOTE: form/input backgrounds ARE set to red (verified live) so the pickers'
  # white value text (inherited from --ha-color-text-primary) reads correctly;
  # they were previously white-on-light. Paired with the transparent-fill /
  # white-ink MDC + legacy input overrides in the input section above.
  ha-color-form-background: var(--hd-red)
  ha-color-form-background-hover: "#D40000"
  ha-color-form-background-disabled: var(--hd-red-dk)

  # ROLE FILLS — IMPORTANT: for the `normal` and `quiet` prominences the fill
  # color ALSO doubles as plain/outlined button TEXT drawn on the red page
  # (Web Awesome renders the fill color as the label color), so those must be
  # dark (red-dk) with a WHITE `on-*` — never a white fill. Only the `-loud`
  # prominence is a real filled surface: primary-loud stays yellow (black text);
  # danger/warning/success-loud stay black (yellow text); neutral is unchanged.
  # primary role
  ha-color-fill-primary-loud-resting: var(--hd-yellow)
  ha-color-fill-primary-loud-hover: "#E6C200"
  ha-color-fill-primary-loud-active: "#E6C200"
  ha-color-fill-primary-normal-resting: var(--hd-red-dk)
  ha-color-fill-primary-normal-hover: "#8F0000"
  ha-color-fill-primary-normal-active: var(--hd-red-dk)
  ha-color-fill-primary-quiet-resting: var(--hd-red-dk)
  ha-color-fill-primary-quiet-hover: "#8F0000"
  ha-color-fill-primary-quiet-active: var(--hd-red-dk)
  ha-color-border-primary-loud: var(--hd-black)
  ha-color-border-primary-normal: var(--hd-black)
  ha-color-border-primary-quiet: var(--hd-black)
  ha-color-on-primary-loud: var(--hd-black)
  ha-color-on-primary-normal: var(--hd-white)
  ha-color-on-primary-quiet: var(--hd-white)

  # neutral role -> black fills / white on ; quiet = dark-red hover tint
  ha-color-fill-neutral-loud-resting: var(--hd-black)
  ha-color-fill-neutral-loud-hover: "#1A1A1A"
  ha-color-fill-neutral-loud-active: var(--hd-black)
  ha-color-fill-neutral-normal-resting: var(--hd-black)
  ha-color-fill-neutral-normal-hover: "#1A1A1A"
  ha-color-fill-neutral-normal-active: var(--hd-black)
  ha-color-fill-neutral-quiet-resting: var(--hd-red-dk)
  ha-color-fill-neutral-quiet-hover: "#8F0000"
  ha-color-fill-neutral-quiet-active: var(--hd-red-dk)
  ha-color-border-neutral-loud: var(--hd-black)
  ha-color-border-neutral-normal: var(--hd-black)
  ha-color-border-neutral-quiet: var(--hd-black)
  ha-color-on-neutral-loud: var(--hd-white)
  ha-color-on-neutral-normal: var(--hd-white)
  ha-color-on-neutral-quiet: var(--hd-white)

  # status roles danger/warning/success -> loud black + yellow (caution-tape),
  # normal/quiet white + black
  ha-color-fill-danger-loud-resting: var(--hd-black)
  ha-color-fill-danger-loud-hover: "#1A1A1A"
  ha-color-fill-danger-loud-active: var(--hd-black)
  ha-color-fill-danger-normal-resting: var(--hd-red-dk)
  ha-color-fill-danger-normal-hover: "#8F0000"
  ha-color-fill-danger-normal-active: var(--hd-red-dk)
  ha-color-fill-danger-quiet-resting: var(--hd-red-dk)
  ha-color-fill-danger-quiet-hover: "#8F0000"
  ha-color-fill-danger-quiet-active: var(--hd-red-dk)
  ha-color-border-danger-loud: var(--hd-black)
  ha-color-border-danger-normal: var(--hd-black)
  ha-color-border-danger-quiet: var(--hd-black)
  ha-color-on-danger-loud: var(--hd-yellow)
  ha-color-on-danger-normal: var(--hd-white)
  ha-color-on-danger-quiet: var(--hd-white)
  ha-color-fill-warning-loud-resting: var(--hd-black)
  ha-color-fill-warning-loud-hover: "#1A1A1A"
  ha-color-fill-warning-loud-active: var(--hd-black)
  ha-color-fill-warning-normal-resting: var(--hd-red-dk)
  ha-color-fill-warning-normal-hover: "#8F0000"
  ha-color-fill-warning-normal-active: var(--hd-red-dk)
  ha-color-fill-warning-quiet-resting: var(--hd-red-dk)
  ha-color-fill-warning-quiet-hover: "#8F0000"
  ha-color-fill-warning-quiet-active: var(--hd-red-dk)
  ha-color-border-warning-loud: var(--hd-black)
  ha-color-border-warning-normal: var(--hd-black)
  ha-color-border-warning-quiet: var(--hd-black)
  ha-color-on-warning-loud: var(--hd-yellow)
  ha-color-on-warning-normal: var(--hd-white)
  ha-color-on-warning-quiet: var(--hd-white)
  ha-color-fill-success-loud-resting: var(--hd-black)
  ha-color-fill-success-loud-hover: "#1A1A1A"
  ha-color-fill-success-loud-active: var(--hd-black)
  ha-color-fill-success-normal-resting: var(--hd-red-dk)
  ha-color-fill-success-normal-hover: "#8F0000"
  ha-color-fill-success-normal-active: var(--hd-red-dk)
  ha-color-fill-success-quiet-resting: var(--hd-red-dk)
  ha-color-fill-success-quiet-hover: "#8F0000"
  ha-color-fill-success-quiet-active: var(--hd-red-dk)
  ha-color-border-success-loud: var(--hd-black)
  ha-color-border-success-normal: var(--hd-black)
  ha-color-border-success-quiet: var(--hd-black)
  ha-color-on-success-loud: var(--hd-yellow)
  ha-color-on-success-normal: var(--hd-white)
  ha-color-on-success-quiet: var(--hd-white)

  # surfaces -> red family (white text); inverted -> black (toasts/tooltips)
  ha-color-surface-default: var(--hd-red)
  ha-color-surface-low: "#D40000"
  ha-color-surface-lower: var(--hd-red-dk)
  ha-color-surface-default-inverted: var(--hd-black)
  ha-color-surface-low-inverted: "#141414"
  ha-color-surface-lower-inverted: var(--hd-black)
  ha-color-on-surface-default: var(--hd-white)

  # text
  ha-color-text-primary: var(--hd-white)
  ha-color-text-secondary: var(--hd-white)
  ha-color-text-disabled: "#E0B3B3"
  ha-color-text-link: var(--hd-yellow)
  ha-color-text-primary-inverted: var(--hd-white)
  ha-color-text-secondary-inverted: "#E0E0E0"

  # focus ring
  ha-color-focus: var(--hd-yellow)

  # ha-switch — pin ON colors directly so the toggle stays yellow track /
  # black thumb regardless of the primary-role fill (now red-dk, see below).
  ha-switch-checked-background-color: var(--hd-yellow)
  ha-switch-checked-background-color-hover: "#E6C200"
  ha-switch-checked-thumb-background-color: var(--hd-black)
  ha-switch-checked-thumb-border-color: var(--hd-black)
  ha-switch-checked-border-color: var(--hd-black)

  # ===========================================================================
  # 18. BOXY INPUTS  (classic Hot Dog Stand look — square corners + search box)
  # ===========================================================================
  # Square corners everywhere via plain variables (robust; these cascade into
  # shadow DOM). Win 3.1 controls were hard rectangles, never rounded.
  ha-border-radius-sm: "0"
  ha-border-radius-md: "0"
  ha-border-radius-lg: "0"
  ha-border-radius-xl: "0"
  wa-border-radius-s: "0"
  wa-border-radius-m: "0"
  wa-border-radius-l: "0"
  wa-form-control-border-radius: "0"
  wa-panel-border-radius: "0"
  mdc-shape-small: "0"
  mdc-shape-medium: "0"
  mdc-shape-large: "0"
  ha-input-search-border-radius: "0"
  # ha-button / ha-fab / chips override the shared radius on their own :host to
  # var(--ha-border-radius-pill) (9999px), so they need their specific tokens
  # squared (the "Add" buttons + the "Add integration" FAB were pills).
  ha-button-border-radius: "0"
  ha-fab-border-radius: "0"
  mdc-fab-border-radius: "0"
  ha-assist-chip-border-radius: "0"

  # card-mod: hard black box border on the config-page search box — the one
  # high-value input a variables-only theme cannot border (Material/Web-Awesome
  # inputs hardcode border:none). Requires card-mod installed as a FRONTEND
  # MODULE (configuration.yaml -> frontend.extra_module_url).
  #   * value MUST be a | STRING of card-mod YAML — a real YAML map => reload 500
  #   * "$" descends into an element's shadow root; "*$" into all children
  #   * border the INNER wa-input::part(base), not the host (host border hidden)
  # Scope is deliberately minimal: text-field / picker / dialog pierces were
  # dropped as too fragile (they break on HA frontend DOM changes) and pickers
  # cannot be bordered at all (a card-mod 4.2.1 localize bug aborts the page).
  card-mod-theme: hotdog-stand-theme
  card-mod-config-yaml: |
    "*$":
      "hass-tabs-subpage-data-table$":
        "ha-data-table$":
          "ha-input-search$":
            ".": |
              wa-input::part(base) { border: 2px solid #000000 !important; border-radius: 0 !important; }
  # Sidebar (card-mod): HA hardcodes body{font-family:Roboto...} (not a
  # variable) and the sidebar inherits it, so the theme's font vars don't reach
  # it — force the pixel font on the sidebar host here. (The bundled font loader
  # /local/hotdog-font.js also sets body{font-family} document-wide for all
  # other chrome; this covers the sidebar instantly on theme reload.)
  # Also kill the subtle yellow tint overlay on the selected item (low-opacity
  # ::before) — the selected item stays obvious via its yellow text + icon.
  card-mod-sidebar-yaml: |
    ".": |
      :host { font-family: var(--hd-font) !important; }
      ha-list-item-button.selected::before { opacity: 0 !important; background: none !important; }
  # Tile/area control buttons -> classic Windows 3.1 buttons: silver face, black
  # icon, raised bevel (border:outset). The ha-control-button component redefines
  # its color vars on :host, so plain theme tokens can't reach it — card-mod sets
  # the host style directly (no shadow-pierce needed: outset border + host bg +
  # the icon-color var flatten it, incl. the entity-colored 'on' light buttons).
  # Applied per-card (card-mod-card runs on every card); the descent no-ops on
  # cards without control-button features. May need updating after major HA
  # dashboard DOM changes.
  card-mod-card-yaml: |
    "hui-card-features$":
      "hui-card-feature$":
        "*$":
          ".": |
            ha-control-button {
              background: #C0C0C0 !important;
              border: 2px outset #C0C0C0 !important;
              --control-button-icon-color: #000000 !important;
              --control-button-background-opacity: 0 !important;
            }
